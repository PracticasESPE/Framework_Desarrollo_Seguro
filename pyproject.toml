[project]
name = "framework-desarrollo-seguro"
version = "0.1.0"
description = "Framework de desarrollo seguro basado en métodos computacionales guiados por conocimiento"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.115",
    "google-genai>=2.28.0",
    "ollama>=0.6.3",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
framework = "orchestrator.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services", "templates", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
