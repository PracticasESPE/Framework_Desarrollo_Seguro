[project]
name = "framework-desarrollo-seguro"
version = "0.1.0"
description = "Framework de desarrollo seguro basado en métodos computacionales guiados por conocimiento"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11.0",
    "fastapi>=0.115",
    "fastembed>=0.9.0",
    "google-genai>=2.28.0",
    "httpx>=0.28.1",
    "neo4j>=6.4.0",
    "ollama>=0.6.3",
    "openai>=3.26.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0.3",
    "typer>=0.15",
    "uvicorn>=0.32",
]

[project.scripts]
framework = "orchestrator.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
    "pytest-cov>=7.1.0",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["orchestrator"]

[tool.uv]
# fastembed 0.9.0 (su última versión) limita pillow a <13, pero pillow 12.x tiene vulnerabilidades
# CRITICAL y HIGH que solo corrige la 13.0.0 (Trivy, Gate 1, 24/10/2026). El framework solo usa
# TextEmbedding, que no procesa imágenes. Quitar cuando fastembed admita pillow 13.
override-dependencies = ["pillow>=13.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integracion: necesita Neo4j real (NEO4J_INTEGRACION=1)"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["services", "templates", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
