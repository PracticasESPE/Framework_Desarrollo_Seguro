id: sbd.secretos.001
directriz: gestion_secretos
descripcion: Ningún secreto vive en el código; se inyectan por variables de entorno o gestores de secretos
aplica_a: [servicio, contenedor, pipeline]
practicas:
  - Claves y contraseñas solo en .env (excluido de Git) o en GitHub Secrets
  - Gitleaks revisa el repositorio en cada ejecución del pipeline
  - Las notificaciones de Telegram nunca incluyen secretos ni fragmentos de código
controles_asociados: [ASVS-V2.10.4, ASVS-V6.4.1]
cwe_mitigadas: [CWE-312, CWE-798]
verificacion: [gitleaks, trivy]
