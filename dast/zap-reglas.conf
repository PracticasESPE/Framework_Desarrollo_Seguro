# Configuracion de zap-api-scan.py (formato: id<TAB>accion<TAB>nombre).
# Al pasar este archivo con -c, ZAP usa la politica completa con TODAS las reglas activas, en lugar
# de las 23 de API-Minimal. Aqui solo se excluyen las que no aplican a una API REST con JSON.
90001	IGNORE	(Insecure JSF ViewState)
90026	IGNORE	(SOAP Action Spoofing)
90029	IGNORE	(SOAP XML Injection)
90030	IGNORE	(WSDL File Detection)
# Un error 500 ante una peticion de ZAP es un fallo del servicio: bloquea el Gate.
100000	FAIL	(A Server Error response code was returned by the server)
