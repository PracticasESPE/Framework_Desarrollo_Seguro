# Excepciones de Trivy image (Gate 3). Solo se acepta un hallazgo cuya corrección todavía no
# está en la imagen base y que no se pueda alcanzar desde el servicio. Cada excepción se limita al
# paquete afectado, explica por qué y caduca: al vencer, el hallazgo vuelve y el Gate 3 lo bloquea
# hasta que alguien la revise. Trivy las sigue mostrando en el log como "Suppressed Vulnerabilities".
#
# Historial: las de zlib1g (CVE-2026-76844 y CVE-2026-85091) vencieron el 21/11/2026 y se
# borraron: la imagen distroless ya trae la zlib corregida y Trivy dejó de verlas.
#
# libssl3t64 (CVE-2026-124709): Debian aún no publica la corrección (Trivy: "affected", sin
# versión corregida). La imagen base distroless nodejs22-debian13 trae libssl3t64 3.5.9-1~deb13u1,
# pero Node.js no la carga: usa su propio OpenSSL compilado en el binario, sin QUIC. Comprobado en
# la imagen el 22/11/2026 con
#   docker run --rm gcr.io/distroless/nodejs22-debian13:nonroot -p "process.config.variables"
# node_shared_openssl=false y openssl_quic=false. Cuando Debian la corrija y Google reconstruya la
# imagen, el CI la descarga (el Dockerfile usa la etiqueta, no un digest), Trivy deja de verla y
# esta entrada se borra.
vulnerabilities:
  - id: CVE-2026-124709
    purls:
      - pkg:deb/debian/libssl3t64
    statement: >-
      Denegación de servicio por pérdida de memoria en la implementación de QUIC del OpenSSL del
      sistema, en la imagen base distroless. El servicio no la alcanza: Node.js no carga
      libssl.so (node_shared_openssl=false, usa el OpenSSL compilado en su binario) y ese OpenSSL
      está compilado sin QUIC (openssl_quic=false). Sin corrección en Debian el 22/11/2026.
      Revisado el 22/11/2026 (Marcelo).
    expired_at: 2026-12-06
  - id: CVE-2026-107494
    purls:
      - pkg:deb/debian/libssl3t64
    statement: >-
      Denegación de servicio por cola sin límite de tramas QUIC en el OpenSSL del sistema, en la
      imagen base distroless. Mismo caso que CVE-2026-124709: Node.js no carga libssl.so
      (node_shared_openssl=false) y su OpenSSL está compilado sin QUIC (openssl_quic=false),
      comprobado en la imagen el 23/11/2026. Sin corrección en Debian en esa fecha.
      Revisado el 23/11/2026 (Marcelo).
    expired_at: 2026-12-06
