# Excepciones de Trivy image (Gate 3). Solo se acepta un hallazgo que no tenga corrección
# publicada y que no se pueda alcanzar desde el servicio. Cada excepción se limita al paquete
# afectado, explica por qué y caduca: al vencer, el hallazgo vuelve y el Gate 3 lo bloquea hasta
# que alguien la revise. Trivy las sigue mostrando en el log como "Suppressed Vulnerabilities".
vulnerabilities:
  - id: CVE-2026-76844
    purls:
      - pkg:deb/debian/zlib1g
    statement: >-
      Desbordamiento en gzwrite() de la zlib del sistema (1.2.11 a 1.3.2), en la imagen base
      distroless nodejs22-debian13. Debian aun no publica la version corregida. El servicio no la
      alcanza: Node.js usa su propia zlib y su propio OpenSSL compilados en el binario, no carga
      libz.so, y su modulo zlib no usa la API gz*. Revisado el 06/11/2026 (Abner).
    expired_at: 2026-12-06
