name: framework-desarrollo-seguro

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline por fases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/usuarios/package-lock.json

      - name: "Fase 1: Adquisición de requisitos"
        run: echo "Pendiente - se implementa en el sprint 3 (Docling y modelo de requisitos)"

      - name: "Fase 2: Análisis y propuesta arquitectónica"
        run: echo "Pendiente - se implementa en el sprint 3 (arquitectura validada por OPA)"

      - name: "Fase 3: Generación y compilación del servicio"
        working-directory: services/usuarios
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npx tsc --noEmit
          npm run build

      - name: "Fase 4: Security Gate 1 (análisis estático)"
        run: |
          fallos=0
          SARIF=salida/security/sarif
          mkdir -p "$SARIF" .trivy-cache
          TRIVY="docker run --rm -v $PWD:/work -v $PWD/.trivy-cache:/root/.cache/trivy -w /work aquasec/trivy:0.71.1"

          echo "=== 1/7 tsc --noEmit (compilación y tipos) ==="
          (cd services/usuarios && npx tsc --noEmit) || fallos=$((fallos+1))

          echo "=== 2/7 ESLint + eslint-plugin-security ==="
          (cd services/usuarios && npx eslint "src/**/*.ts") || fallos=$((fallos+1))

          echo "=== 3/7 Semgrep (SAST) ==="
          docker run --rm -v "$PWD:/src" semgrep/semgrep:1.172.0 \
            semgrep scan --config p/typescript --config p/nodejs --metrics=off \
            --error --severity ERROR --severity WARNING \
            --sarif-output="$SARIF/semgrep.sarif" \
            --exclude generated --exclude "*.spec.ts" services/usuarios/src \
            || fallos=$((fallos+1))

          echo "=== 4/7 Gitleaks (secretos en el historial) ==="
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1 git --no-banner --redact --verbose \
            --report-format sarif --report-path "/repo/$SARIF/gitleaks.sarif" /repo \
            || fallos=$((fallos+1))

          echo "=== 5/7 Trivy fs (SCA: dependencias npm) ==="
          $TRIVY fs --scanners vuln --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs "**/node_modules" --skip-dirs .trivy-cache --skip-dirs salida . \
            || fallos=$((fallos+1))
          $TRIVY fs --scanners vuln --severity HIGH,CRITICAL \
            --skip-dirs "**/node_modules" --skip-dirs .trivy-cache --skip-dirs salida \
            --format sarif --output "$SARIF/trivy-fs.sarif" . || true

          echo "=== 6/7 Trivy config (Dockerfile y Compose) ==="
          $TRIVY config --severity HIGH,CRITICAL --exit-code 1 \
            --skip-dirs "**/node_modules" --skip-dirs .trivy-cache --skip-dirs salida . \
            || fallos=$((fallos+1))
          $TRIVY config --severity HIGH,CRITICAL \
            --skip-dirs "**/node_modules" --skip-dirs .trivy-cache --skip-dirs salida \
            --format sarif --output "$SARIF/trivy-config.sarif" . || true

          echo "=== 7/7 Hadolint (buenas prácticas del Dockerfile) ==="
          docker run --rm -v "$PWD:/work" -w /work hadolint/hadolint:v2.15.1 \
            hadolint --failure-threshold warning services/usuarios/Dockerfile \
            || fallos=$((fallos+1))
          docker run --rm -v "$PWD:/work" -w /work hadolint/hadolint:v2.15.1 \
            hadolint --no-fail --format sarif services/usuarios/Dockerfile \
            > "$SARIF/hadolint.sarif" || true

          echo "=== Archivos SARIF generados ==="
          ls -l "$SARIF"

          echo "=== Resultado del Gate 1: $fallos herramienta(s) con hallazgos ==="
          [ "$fallos" -eq 0 ]

      - name: "Fases 5-6: Refinamiento iterativo"
        run: echo "Pendiente - se implementa en el sprint 5"

      - name: "Fase 7: Integración de microservicios"
        run: echo "Pendiente - se implementa en el sprint 5 (Traefik, RabbitMQ, Keycloak)"

      - name: "Fase 8: Security Gate 2"
        run: echo "Pendiente - versión inicial el 21/10 (Spectral y Conftest)"

      - name: "Fase 9: Pruebas automatizadas"
        working-directory: services/usuarios
        run: npm run test:cov

      - name: "Fase 10: Contenerización"
        run: docker build -t fw-usuarios:ci services/usuarios

      - name: "Fase 11: DAST y Security Gate 3"
        run: echo "Pendiente - versión inicial el 26/10 (ZAP, Nuclei, Trivy image)"

      - name: "Publicar SARIF: Semgrep"
        if: always() && hashFiles('salida/security/sarif/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/semgrep.sarif
          category: semgrep

      - name: "Publicar SARIF: Gitleaks"
        if: always() && hashFiles('salida/security/sarif/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/gitleaks.sarif
          category: gitleaks

      - name: "Publicar SARIF: Trivy fs"
        if: always() && hashFiles('salida/security/sarif/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/trivy-fs.sarif
          category: trivy-fs

      - name: "Publicar SARIF: Trivy config"
        if: always() && hashFiles('salida/security/sarif/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/trivy-config.sarif
          category: trivy-config

      - name: "Publicar SARIF: Hadolint"
        if: always() && hashFiles('salida/security/sarif/hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/hadolint.sarif
          category: hadolint

      - name: Guardar los SARIF como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sarif-gate1
          path: salida/security/sarif/
          if-no-files-found: ignore
          retention-days: 14
