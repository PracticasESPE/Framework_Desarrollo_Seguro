name: framework-desarrollo-seguro

on:
  pull_request:
    branches: [dev, test, main]
  push:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: framework-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: Pipeline por fases
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    # Neo4j propio de cada ejecución: nace y muere con el trabajo, solo es accesible
    # desde el runner. La contraseña cambia en cada ejecución y no es un secreto.
    services:
      neo4j:
        image: neo4j:5.26-community
        env:
          NEO4J_AUTH: neo4j/ci-${{ github.run_id }}
        ports:
          - 7687:7687
        options: >-
          --health-cmd "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      NEO4J_URI: bolt://localhost:7687
      NEO4J_PASSWORD: ci-${{ github.run_id }}
      NEO4J_INTEGRACION: "1"
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/usuarios/package-lock.json

      - name: Preparar uv (motor en Python)
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: true

      - name: Pruebas del motor (pytest, incluye integración con Neo4j)
        run: |
          mkdir -p salida/pruebas
          uv run pytest -q --cov=orchestrator --cov-report=term \
            --cov-report=xml:salida/pruebas/cobertura.xml \
            --junitxml=salida/pruebas/pytest.xml | tee salida/pruebas/pytest.txt
          {
            echo "### Pruebas del motor (pytest)"
            echo '```'
            grep -E "^(Name|TOTAL|orchestrator)|passed|failed|error" salida/pruebas/pytest.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Esquema de Neo4j (restricciones e índices)
        run: uv run framework grafo esquema

      - name: "Fase 1: Adquisición de requisitos"
        run: echo "Pendiente - se implementa en el sprint 3 (Docling y modelo de requisitos)"

      - name: "Fase 2: Análisis y propuesta arquitectónica"
        run: echo "Pendiente - se implementa en el sprint 3 (arquitectura validada por OPA)"

      - name: "Fase 3: Generación y compilación del servicio"
        working-directory: services/usuarios
        env:
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
        run: |
          npm ci --ignore-scripts
          npx prisma generate
          npx tsc --noEmit
          npm run build

      - name: Caché de la base de datos de Trivy
        uses: actions/cache@v4
        with:
          path: .trivy-cache
          key: trivy-db-${{ github.run_id }}
          restore-keys: trivy-db-

      - name: Fase 4 - Security Gate 1
        run: bash scripts/gate1.sh

      # Se ejecuta aunque el Gate 1 encuentre problemas, para normalizar sus resultados.
      - name: "Fase 4 en el motor: hallazgos registrados en Neo4j"
        if: ${{ !cancelled() && hashFiles('salida/security/sarif/*.sarif') != '' }}
        run: >-
          uv run framework run --fase 4 --grafo
          --descripcion "CI ${{ github.event_name }} ${{ github.ref_name }} ${{ github.sha }}"

      - name: Hallazgos visibles en Neo4j
        if: ${{ !cancelled() && hashFiles('salida/hallazgos/fase4.json') != '' }}
        run: |
          uv run framework hallazgos listar
          echo "--- Contenido del grafo ---"
          uv run framework grafo resumen

      # Cuando el Gate 1 no encuentra nada, esto muestra cómo se ven los hallazgos en el
      # grafo usando los SARIF de ejemplo de las pruebas, en una ejecución aparte.
      - name: "Demostración: SARIF de ejemplo registrados en Neo4j"
        if: ${{ !cancelled() }}
        run: |
          uv run framework hallazgos registrar tests/datos/sarif --documento "Ejemplos SARIF (demostración)"
          uv run framework hallazgos listar
          echo "--- Contenido del grafo ---"
          uv run framework grafo resumen

      - name: "Fases 5-6: Refinamiento iterativo"
        run: echo "Pendiente - se implementa en el sprint 5"

      - name: "Fase 7: Integración de microservicios"
        run: echo "Pendiente - se implementa en el sprint 5 (Traefik, RabbitMQ, Keycloak)"

      - name: "Fase 8: Security Gate 2"
        run: echo "Pendiente - versión inicial el 21/10 (Spectral y Conftest)"

      - name: "Fase 9: Pruebas automatizadas"
        working-directory: services/usuarios
        run: npm run test:cov

      - name: "Fase 10: Contenerización"
        run: docker build -t fw-usuarios:ci services/usuarios

      - name: "Fase 11: DAST y Security Gate 3"
        run: echo "Pendiente - versión inicial el 26/10 (ZAP, Nuclei, Trivy image)"

      - name: "Publicar SARIF: Semgrep"
        if: always() && hashFiles('salida/security/sarif/semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/semgrep.sarif
          category: semgrep

      - name: "Publicar SARIF: Gitleaks"
        if: always() && hashFiles('salida/security/sarif/gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/gitleaks.sarif
          category: gitleaks

      - name: "Publicar SARIF: Trivy fs"
        if: always() && hashFiles('salida/security/sarif/trivy-fs.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/trivy-fs.sarif
          category: trivy-fs

      - name: "Publicar SARIF: Trivy config"
        if: always() && hashFiles('salida/security/sarif/trivy-config.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/trivy-config.sarif
          category: trivy-config

      - name: "Publicar SARIF: Hadolint"
        if: always() && hashFiles('salida/security/sarif/hadolint.sarif') != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: salida/security/sarif/hadolint.sarif
          category: hadolint

      - name: Guardar los SARIF como artefacto
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: sarif-gate1
          path: |
            salida/security/sarif/
            salida/hallazgos/
            salida/pruebas/
          if-no-files-found: ignore
          retention-days: 14
