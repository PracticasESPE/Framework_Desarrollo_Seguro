# Respuesta esperada del documento de requisitos 2 (gestión académica).
# Solo la usa la evaluación: el framework recibe requisitos.{pdf,docx,txt,md} y nunca este archivo.
# Cada "texto" es literal del documento, para medir qué requisitos encuentra la fase 1.
# Etiquetas: vocabulario de ../vocabulario.yaml. Controles, riesgos y patrones: knowledge_base/.
documento: 02_gestion_academica
titulo: Gestión académica
version: "1.0"
complejidad: media

servicios:
  - nombre: usuarios
    responsabilidad: Cuentas, perfiles, doble factor, sesiones y registro de estudiantes
  - nombre: oferta
    responsabilidad: Asignaturas, paralelos, horarios, cupos y requisitos previos de cada periodo
  - nombre: matriculas
    responsabilidad: Matrícula, cupos, confirmación del pago, anulaciones y consulta de la biblioteca
  - nombre: calificaciones
    responsabilidad: Asistencia, notas, aprobación de cambios, cierre del periodo y reportes
  - nombre: certificados
    responsabilidad: Emisión de certificados en PDF y su verificación pública
  - nombre: notificaciones
    responsabilidad: Correos y recordatorios a partir de los eventos de matrícula y calificaciones

# Orientativo: una propuesta razonable, no la única válida. Sirve para comparar la fase 2.
patrones:
  - patron: api_gateway
    motivo: Única dirección de entrada y límite de peticiones por persona o equipo (11.1 y 11.3)
  - patron: database_per_service
    motivo: Matrícula, calificaciones y certificados se actualizan por separado (11.4)
  - patron: event_driven
    motivo: Los avisos reaccionan a la publicación de notas y a la confirmación de la matrícula (9.1)
  - patron: circuit_breaker
    motivo: Un fallo en los certificados no impide matricularse ni registrar notas (11.4)

