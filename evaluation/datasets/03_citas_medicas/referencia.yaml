# Respuesta esperada del documento de requisitos 3 (citas médicas).
# Solo la usa la evaluación: el framework recibe requisitos.{pdf,docx,txt,md} y nunca este archivo.
# Cada "texto" es literal del documento, para medir qué requisitos encuentra la fase 1.
# Etiquetas: vocabulario de ../vocabulario.yaml. Controles, riesgos y patrones: knowledge_base/.
documento: 03_citas_medicas
titulo: Citas médicas
version: "1.0"
complejidad: alta

servicios:
  - nombre: usuarios
    responsabilidad: Cuentas de pacientes y personal, doble factor, delegación a menores y derechos sobre los datos
  - nombre: agenda
    responsabilidad: Horarios de los médicos, reservas, reglas de uso, teleconsulta e indicadores
  - nombre: historia_clinica
    responsabilidad: Consultas, diagnósticos, recetas, accesos de urgencia y registro de quién consulta cada historia
  - nombre: laboratorio
    responsabilidad: Recepción de los resultados del laboratorio externo y su revisión
  - nombre: pagos
    responsabilidad: Copagos con la pasarela externa, confirmación de citas y devoluciones
  - nombre: notificaciones
    responsabilidad: Recordatorios y avisos por correo y mensaje de texto, sin datos de salud

# Orientativo: una propuesta razonable, no la única válida. Sirve para comparar la fase 2.
patrones:
  - patron: api_gateway
    motivo: Única dirección de entrada y límites de peticiones y de búsquedas (11.1 y 11.3)
  - patron: bff
    motivo: La web de pacientes y la aplicación del personal reciben cada una solo lo que necesitan (11.2)
  - patron: database_per_service
    motivo: Cada servicio tiene sus datos y la historia clínica solo la toca su servicio (11.5)
  - patron: event_driven
    motivo: Avisos, recordatorios y resultados de laboratorio reaccionan a eventos (5.3, 6.2 y 8.1)
  - patron: saga
    motivo: Reserva y pago se confirman juntos, y se compensan si el pago no llega o el médico cancela (7.2 y 7.3)
  - patron: circuit_breaker
    motivo: Si el laboratorio no responde, el resto del sistema sigue funcionando (6.3)

