# PostgreSQL con pgvector solo para la prueba comparativa de bases de datos (plan técnico, 5.1.4).
# No forma parte del framework: Neo4j sigue siendo su única base.
# Uso: docker compose -f evaluation/benchmark_bd/docker-compose.yml up -d
name: framework-benchmark

services:
  postgres:
    image: pgvector/pgvector:0.8.1-pg17
    container_name: fw-benchmark-pg
    environment:
      POSTGRES_DB: benchmark
      POSTGRES_USER: benchmark
      POSTGRES_PASSWORD: ${BENCHMARK_DB_PASSWORD:?Falta BENCHMARK_DB_PASSWORD en .env}
    ports:
      - '127.0.0.1:${BENCHMARK_DB_PORT:-5434}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U benchmark -d benchmark']
      interval: 5s
      timeout: 5s
      retries: 20
    security_opt:
      - no-new-privileges:true
