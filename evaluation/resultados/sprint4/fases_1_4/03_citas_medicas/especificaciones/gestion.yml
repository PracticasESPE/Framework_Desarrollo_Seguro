servicio: gestion
descripcion: Administración de médicos, especialidades y sedes; configuración de horarios;
  generación de reportes de ocupación; envío de notificaciones (recordatorios, avisos
  de acceso urgente); manejo de datos personales y cumplimiento de derechos; exposición
  de APIs diferenciadas para pacientes y personal.
base_datos: gestion_db
puerto: 3006
entidades:
- nombre: medico
  campos:
  - nombre: nombre_completo
    tipo: texto
    requerido: true
    min: 1
    max: 150
  - nombre: correo
    tipo: correo
    requerido: true
    unico: true
  - nombre: numero_colegiatura
    tipo: texto
    descripcion: Número de colegiatura profesional; dato mínimo para identificar al
      médico.
    requerido: true
    unico: true
    min: 3
    max: 30
  - nombre: keycloak_id
    tipo: uuid
    descripcion: Identificador del médico en Keycloak (servicio de identidad); no
      se guardan credenciales.
    requerido: true
    unico: true
  - nombre: especialidad_id
    tipo: referencia
    descripcion: Especialidad principal; las adicionales se reflejan en los horarios
      por sede.
    requerido: true
    entidad: especialidad
  - nombre: activo
    tipo: booleano
    requerido: true
- nombre: especialidad
