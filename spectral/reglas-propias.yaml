# Reglas propias del framework para el contrato OpenAPI.
# Se comprueban en cada ejecución con spectral/pruebas/malo.json y bueno.json (scripts/gate2.sh).
rules:
  fw-ruta-con-prefijo-api:
    description: Todas las rutas cuelgan de /api/ (inventario de la API, OWASP API9).
    message: "La ruta {{property}} no empieza por /api/"
    severity: error
    given: $.paths[*]~
    then:
      function: pattern
      functionOptions:
        match: "^/api/"

  fw-sin-secretos-en-query:
    description: Ningún secreto viaja en la URL (ASVS V13.1.3, CWE-598).
    message: "El parámetro de consulta {{value}} parece un secreto; envíalo en la cabecera Authorization o en el cuerpo"
    severity: error
    given: $..parameters[?(@.in == 'query')].name
    then:
      function: pattern
      functionOptions:
        notMatch: "/^(password|passwd|pwd|token|secret|api[_-]?key|access[_-]?token)$/i"

  fw-respuesta-sin-campos-sensibles:
    description: Las respuestas no exponen contraseñas, hashes ni secretos (OWASP API3, CWE-200).
    message: "La respuesta expone el campo sensible {{property}}"
    severity: error
    given: $.components.schemas[?(@property.match(/(Respuesta|Response)/))].properties[*]~
    then:
      function: pattern
      functionOptions:
        notMatch: "/(password|passwd|contrasena|clave|hash|secret|token)/i"

  fw-version-semantica:
    description: La versión de la API sigue el formato MAJOR.MINOR.PATCH (inventario, OWASP API9).
    message: "info.version debe ser del tipo 1.0.0 (actual: {{value}})"
    severity: warn
    given: $.info.version
    then:
      function: pattern
      functionOptions:
        match: "^[0-9]+[.][0-9]+[.][0-9]+$"
