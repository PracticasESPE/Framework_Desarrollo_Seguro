# Gate 2 (inicial): reglas de contrato OpenAPI alineadas con OWASP API Security Top 10 (2023).
# Todas las reglas conservan su severidad original salvo las de abajo (tabla en spectral/README.md).
extends:
  - spectral:oas
  - "@stoplight/spectral-owasp-ruleset"
  - ./reglas-propias.yaml

rules:
  # --- Se cumplen con el guard JWT de Keycloak (23/10): pasan de aviso a error ---
  owasp:api2:2023-read-restricted: error
  owasp:api8:2023-define-error-responses-401: error
  # owasp:api2:2023-write-restricted ya es "error" en el conjunto OWASP: vuelve a su valor original.

  # --- Siguen en "warn": limitación de tasa en el gateway Traefik (sprint 5, 01/12) ---
  owasp:api4:2023-rate-limit: warn
